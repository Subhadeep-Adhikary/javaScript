<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <main class="game">
            <section class="card">
                <header class="header"><h1>Guess the correct number</h1></header>
                <p class="info">You have only <strong>10</strong> attempts</p>
                <p class="info">The number will be between <strong>1</strong> and <strong>10</strong></p>

                <div class="status">
                    <div class="number">?</div>
                    <div class="message">Start guessing...</div>
                </div>

                <form class="guess-form">
                    <input class="guess-input" type="number" min="1" max="10" placeholder="Enter 1-10">
                    <button class="btn guess-btn">Lock</button>    
                </form>
                <button class="btn reset-btn" type="button">Restart</button>

                <div class="remaining">Turns left <span>10</span></div>
                <div class="previous">Previous: <span class="list">—</span></div>
            </section>
        </main>
</body>
<script src="script.js"></script>
</html>
